version: '3.8'

services:
  # Backend - Python FastAPI + Pipecat Voice Assistant
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nester-backend
    ports:
      - "7860:7860"
      - "8765:8765"
    environment:
      # API Keys - Set these in .env file or pass directly
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX}
      # Server Configuration
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=7860
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8765
      - WEBSOCKET_SERVER=websocket_server
      - PUBLIC_URL=${PUBLIC_URL}
      # Session Settings
      - SESSION_TIMEOUT=180
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nester-network

  # Frontend - Vite + TypeScript served by Nginx
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nester-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:7860
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nester-network

networks:
  nester-network:
    driver: bridge
