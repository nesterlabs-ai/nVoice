<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nester AI - Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Main content area (your app content goes here) -->
  <div class="app-content">
    <!-- Header with branding -->
    <header class="app-header">
      <div class="brand">
        <img src="/nester-icon.png" alt="Nester AI" class="brand-icon" onerror="this.style.display='none'">
        <span class="brand-name">Nester AI</span>
      </div>
    </header>

    <!-- Conversation display area -->
    <div class="conversation-area" id="conversation-area">
      <div class="welcome-message" id="welcome-message">
        <h2>Hi, I'm Nester</h2>
        <p>Your AI voice assistant. Tap the orb below to start talking.</p>
      </div>

      <!-- Transcript bubbles appear here -->
      <div class="transcript-list" id="transcript-list"></div>
    </div>
  </div>

  <!-- Floating Voice Orb Widget -->
  <div class="voice-orb-container" id="voice-orb-container">
    <!-- Outer glow rings -->
    <div class="orb-glow-ring ring-1"></div>
    <div class="orb-glow-ring ring-2"></div>
    <div class="orb-glow-ring ring-3"></div>

    <!-- Main orb -->
    <div class="voice-orb" id="voice-orb">
      <!-- Animated gradient background -->
      <div class="orb-gradient"></div>

      <!-- Inner dark circle -->
      <div class="orb-inner">
        <!-- Mic icon (idle/listening) -->
        <svg class="orb-icon icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>

        <!-- Wave bars (speaking) -->
        <div class="orb-waves">
          <span class="wave-bar" style="--i: 0"></span>
          <span class="wave-bar" style="--i: 1"></span>
          <span class="wave-bar" style="--i: 2"></span>
          <span class="wave-bar" style="--i: 3"></span>
          <span class="wave-bar" style="--i: 4"></span>
        </div>

        <!-- Thinking dots -->
        <div class="orb-thinking">
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
        </div>
      </div>
    </div>

    <!-- Status label -->
    <div class="orb-status" id="orb-status">Tap to talk</div>
  </div>

  <!-- Debug panel (hidden by default) -->
  <div class="debug-panel" id="debug-panel">
    <div class="debug-header">
      <span>Activity Log</span>
      <button class="debug-close" id="debug-close">&times;</button>
    </div>
    <div class="debug-content" id="debug-log"></div>
  </div>

  <!-- Debug toggle button -->
  <button class="debug-toggle" id="debug-toggle" aria-label="Toggle Debug Log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 20V10"/>
      <path d="M18 20V4"/>
      <path d="M6 20v-4"/>
    </svg>
  </button>

  <audio id="bot-audio" autoplay></audio>

  <script type="module" src="/src/app.ts"></script>
  <link rel="stylesheet" href="/src/style.css">
</body>

</html>
