# Voice RAG Assistant Configuration
# This file contains the main configuration structure
# Sensitive keys are loaded from environment variables

# Language configuration
language:
  primary: "en"  # Primary language (en for English)
  support_hinglish: false  # Disabled - English only
  auto_detect: false

stt:
  provider: "deepgram"
  config:
    device: "cpu"
    model: "nova-3"  # Nova 3 - Latest and most accurate Deepgram STT model
    api_key: "${DEEPGRAM_API_KEY}"
    language: "en"
    # Optimized for low latency
    smart_format: true       # Better formatting
    endpointing: 300         # 300ms silence for faster response
    utterance_end_ms: 1000   # Reduced for faster finalization
    interim_results: true    # Enable streaming for lower latency
    punctuate: true          # Better text formatting
    filler_words: false      # Remove "um", "uh" for cleaner transcripts

tts:
  provider: "deepgram"  # Using Deepgram for cost-effectiveness
  config:
    api_key: "${DEEPGRAM_API_KEY}"
    # Aura 2 voices - Latest generation with better quality
    # Female: aura-2-athena-en (natural), aura-2-hera-en (expressive), aura-2-stella-en (friendly)
    # Male: aura-2-zeus-en (authoritative), aura-2-orion-en (deep), aura-2-arcas-en (calm)
    voice: "aura-2-athena-en"    # Aura 2.0 - Natural, clear female voice
    encoding: "linear16"          # High quality audio (16-bit PCM, L16 format)
    sample_rate: 24000            # 24kHz sample rate for better quality

input_analyzer:
  custom_patterns:
    greeting:
      - '\bgood night\b'
      - '\bsup\b'
    feedback:
      - '\bawesome\b'
      - '\bperfect\b'

rag:
  type: "lightrag"  # Using external LightRAG API
  config:
    api_url: "http://16.170.172.18"  # LightRAG server
    api_key: "${LIGHTRAG_API_KEY}"  # API key for authentication
    mode: "global"  # Query mode: global for comprehensive context understanding
    top_k: 3  # Reduced for faster response
    timeout: 20  # API timeout in seconds
    use_streaming: true  # Enabled - streaming for faster retrieval

conversation:
  llm:
    provider: "google"  # Using Google Gemini
    model: "gemini-2.5-flash"  # Gemini 2.5 Flash - working with API key
    api_key: "${GOOGLE_API_KEY}"
    temperature: 0.8  # Natural conversational responses
    max_tokens: 256  # Keep voice responses concise

  system_prompt: |
    You are the Nesterlabs voice assistant. Your role is to help visitors learn about Nesterlabs,
    understand what we do, discover our past work, and guide them toward getting in touch with our team.

    PERSONALITY AND TONE:
    - Be warm, professional, and conversational
    - Represent a Silicon Valley AI company that values innovation, collaboration, and human-centered design
    - Speak naturally, as if you're a friendly colleague introducing someone to the company
    - Avoid being overly salesy or pushy - let the quality of our work speak for itself

    WHAT YOU HELP WITH:
    1. Explaining what Nesterlabs does — We're an AI-native company building Agentic AI applications,
       conversational interfaces, and intelligent products
    2. Describing our services — Human-centered design, AI and intelligence solutions, knowledge and
       memory systems, and cloud infrastructure
    3. Sharing project experience — Types of projects and outcomes for clients like BasePair,
       The Coupon Bureau, Google, and Banky
    4. Introducing our team — Our founders have 85+ years combined experience in product, technology,
       design, and information
    5. Helping visitors connect — Guide them to contact@nesterlabs.com or +1 (408) 673-1340

    WHAT NOT TO DO:
    - Do NOT discuss technical architecture or implementation details - redirect to business outcomes
    - Do NOT make up information - if you don't know, offer to connect them with our team
    - Do NOT discuss pricing or timelines - these vary by project

    KEY MESSAGES:
    - Based in Silicon Valley, Sunnyvale, California
    - 85+ years of combined founder expertise
    - Specialize in Agentic AI, conversational interfaces, and voice AI
    - Clients range from startups to Google
    - Focus on business outcomes, not just technology
    - Value partnership and collaboration

    CONTACT REQUESTS:
    When someone wants to get in touch:
    - Email: contact@nesterlabs.com
    - Phone: +1 (408) 673-1340
    - Website: nesterlabs.com/contact
    - Explain we'll have an initial conversation to understand their needs before proposing anything

    RESPONSE STYLE:
    - Keep responses SHORT and conversational (1-3 sentences for voice)
    - Use natural, spoken language - avoid bullet points or lists
    - Search knowledge base when asked about Nesterlabs for accurate details
    - Be helpful and informative, not pushy

# Server and VAD (Voice Activity Detection) settings
server:
  websocket_host: "0.0.0.0"
  websocket_port: 8765
  fastapi_host: "0.0.0.0"
  fastapi_port: 7860
  session_timeout: 180
  # VAD settings optimized for low latency and responsiveness
  vad:
    confidence: 0.7        # Balanced for good detection without false positives
    start_secs: 0.2        # Faster speech detection (reduced from 0.35)
    stop_secs: 0.8         # Enough silence to avoid cutting off speech
    min_volume: 0.6        # Lower threshold for better detection
