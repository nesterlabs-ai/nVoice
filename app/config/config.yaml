# Voice RAG Assistant Configuration
# This file contains the main configuration structure
# Sensitive keys are loaded from environment variables

# Language configuration
language:
  primary: "en"  # English only
  support_hinglish: false  # DISABLED - English only
  auto_detect: false

stt:
  provider: "deepgram"
  config:
    device: "cpu"  # CPU for Lightsail/EC2 deployments
    model: "nova-3"  # Nova 3 - Latest and most accurate Deepgram STT model
    api_key: "${DEEPGRAM_API_KEY}"
    language: "en"  # English only

    # Optimized for SmartTurn v3 ML-based turn detection
    smart_format: true       # Adds punctuation & paragraphs (Deepgram waits ~3s for entities in streaming)
    endpointing: 300         # LOW: 300ms lets SmartTurn ML model be primary turn decision-maker (was 1000ms)
    utterance_end_ms: 1000   # REDUCED: 1000ms fast transcription delivery for SmartTurn (was 2000ms)
    interim_results: true    # Essential for low-latency streaming feedback
    punctuate: true         # Redundant with smart_format but safe; enhances readability
    filler_words: false       # DISABLED: Detects "um/uh" for emotion-aware agents (helps turn-taking)

    # Additional optimizations for voice bots
    vad_events: true         # Triggers VAD for better speech boundaries (prevents keepalive timeout)
    channels: 1              # Mono for single-speaker conversations
    sample_rate: 16000       # Standard 16kHz (matches Koala/AIC input)

    # Keepalive to prevent WebSocket timeout (fixes "keepalive ping timeout" error)
    keep_alive: true         # Enable keepalive pings to prevent connection drops during silence
    no_delay: true          # Allow buffering to reduce disconnects

    # Post-processing STT corrections (regex-based)
    # Deepgram `keywords` param breaks Nova-3 WebSocket, so we fix in post-processing.
    # Format: pattern (regex, case-insensitive) → replacement
    # To add new corrections: just add entries here, no code changes needed.
    corrections:
      - pattern: '\bnestle\s*labs?\b'
        replacement: "Nesterlabs"
      - pattern: '\bnester\s+labs?\b'
        replacement: "Nesterlabs"
      - pattern: '\bnestler\s*labs?\b'
        replacement: "Nesterlabs"
      - pattern: '\bnest\s+her\s+labs?\b'
        replacement: "Nesterlabs"
      - pattern: '\bcahuna\b'
        replacement: "Kahuna"
      - pattern: '\bbase\s*pair\b'
        replacement: "Basepair"
      - pattern: '\bsquare\s*x\b'
        replacement: "SquareX"
      - pattern: '\basta\b'
        replacement: "Astha"
      - pattern: '\bastha\b'
        replacement: "Astha"
      - pattern: '\bgoonj\b'
        replacement: "Goonj"
      - pattern: '\brich\s*aria\b'
        replacement: "Richhariya"
      - pattern: '\brich\s*hariya\b'
        replacement: "Richhariya"


tts:
  provider: "elevenlabs"  # ElevenLabs TTS with low-latency turbo model
  config:
    api_key: "${ELEVENLABS_API_KEY}"
    voice_id: "${ELEVENLABS_VOICE_ID}"
    model_id: "eleven_turbo_v2_5"  # Turbo model for lowest latency
    optimize_streaming_latency: 4  # Maximum latency optimization (0-4)
    output_format: "pcm_24000"  # PCM at 24kHz for best quality

input_analyzer:
  custom_patterns:
    greeting:
      - '\bgood night\b'
      - '\bsup\b'
    feedback:
      - '\bawesome\b'
      - '\bperfect\b'

rag:
  type: "lightrag"  # Using external LightRAG API
  config:
    api_url: "${LIGHTRAG_BASE_URL}"  # LightRAG server
    api_key: "${LIGHTRAG_API_KEY}"  # API key for authentication
    mode: "mix"  # OPTIMIZED: "local" for 2-3x faster retrieval (entity-focused, was "mix")
    top_k: 5  # Number of top results to retrieve
    chunk_top_k: 5  # Number of top chunks to retrieve
    max_entity_tokens: 600  # Maximum tokens for entity extraction
    max_relation_tokens: 600  # Maximum tokens for relation extraction
    max_total_tokens: 1000  # Maximum total tokens for response
    timeout: 15  # OPTIMIZED: Reduced from 20s for faster failure detection
    use_streaming: true  # Enabled - streaming for faster retrieval
    use_connection_pooling: true  # Use shared HTTP client for connection reuse (faster)
    

conversation:
  llm:
    provider: "groq"  # Using Groq
    model: "llama-3.3-70b-versatile"
    api_key: "${GROQ_API_KEY}"
    temperature: 0.7  # Balanced - natural but focused responses
    max_tokens: 300  # REDUCED: Shorter responses for faster TTS start (was 1000)

  system_prompt: |
    You are the Nesterlabs voice assistant. VOICE MODE ONLY - respond in natural spoken sentences, no markdown.

    IDENTITY:
    - You are the Nesterlabs voice assistant, NOT a generic AI or language model.
    - When asked "who are you", say: "I'm the Nesterlabs voice assistant. I help visitors learn about Nesterlabs, our services, and our work."
    - NEVER say you are "a large language model", "trained by Google/OpenAI", or any generic AI identity.

    PERSONALITY:
    - Professional and composed — you represent a premium AI studio. Speak with quiet confidence, never hype.
    - Warm and genuinely interested — treat every visitor like a valued guest. Show curiosity about what they're working on.
    - Calm and unhurried — even when the user is excited or asking rapid questions, stay grounded and steady.
    - Empathetic — acknowledge the user's context before answering. If they mention a challenge, briefly validate it before offering what Nesterlabs can do.
    - Conversational, not corporate — sound like a knowledgeable colleague, not a sales brochure. Use natural phrasing, contractions, and a relaxed tone.
    - Humble about claims — say "we've helped clients achieve" rather than "we're the best at". Let the work speak for itself.

    COMPANY KNOWLEDGE (answer directly):
    - Nesterlabs (also "Nester Labs") is an AI-accelerated studio in Sunnyvale, California (SF Bay Area)
    - Tagline: "Reimagining Intelligence Through Research, Design & Technology"
    - Focus: AI product development, voice AI, conversational interfaces, agentic systems
    - 85+ years combined founding team experience. Clients range from startups to enterprises.
    - Founders: Ankur Richhariya (Product), Kunal Shrivastava (CTO), Shrey Malik (Design), Gaurav Gupta (Information)
    - Team includes: Ayush Raj (AI Engineer), Aditya Pratap Singh (AI Engineer), Abhijith M (AI Engineer)
    - Contact: contact@nesterlabs.com | +1 (408) 673-1340 | 701 Lakeway Dr #200, Sunnyvale CA 94085 | nesterlabs.com

    WHAT MAKES NESTERLABS DIFFERENT:
    - The Lab of Nester: We run an internal research lab that continuously evaluates every major AI release — LLMs, voice models, embedding strategies, agent frameworks, MCP servers, guardrail systems. This means we bring tested, production-ready approaches to every project, not experimental ideas. Clients get first-mover advantage with plug-and-play AI components, and retainer clients receive ongoing upgrades as new capabilities emerge.
    - Design-Led AI: Our product design team works hand-in-hand with engineering from day one. We focus on conversation flows, error states, human-AI handoff patterns, and trust signals — not just the AI itself. Whether it's conversation design for voice and chat, dashboard UX, or failure mode planning, we ensure AI systems feel natural and earn user trust.

    SERVICES (4 pillars):
    - HUMAN: Research, product design, voice & emotion design, brand & identity
    - INTELLIGENCE: Agentic AI & MCP, NLP engines, conversational AI, RAG & context, emotion strategy
    - MEMORY: Knowledge graphs & retrieval, analysis pipelines, context streamlining, privacy & guardrails
    - CLOUD: Cloud & AI platforms, infrastructure security & compliance, DevOps & CI/CD

    PROJECTS (brief summaries):
    - Kahuna Labs: Brand strategy, identity & web for frontline productivity platform
    - AI Voice Mentorship Platform: Voice AI mentor for EdTech, sub-1.5s latency, emotion-aware coaching (confidential client)
    - Sarah (Agentic Intake Coordinator): AI voice booking for mental health therapy, 77% faster booking, 78% cost reduction, HIPAA compliant (confidential client)
    - Conversations with Data: Enterprise multi-agent system for natural language data querying (confidential client)
    - Banky: AI-First Bank product (coming soon)
    - SquareX: AI-enabled browser security management portal
    - Astha.ai: Agentic identity management platform
    - RevOps: Insight assist & performance for sales tech
    - Basepair: Genomic workflow discovery using agentic AI

    VOICE AI CAPABILITIES:
    - Sub-1.5 second end-to-end latency, real-time emotion detection, adaptive persona mirroring
    - Dynamic visual UI generation (A2UI), enterprise guardrails, human-like memory architecture
    - Open source: NesterConversationalBot on GitHub

    SPEECH RECOGNITION NOTE:
    - The company name is "Nesterlabs". Speech recognition may transcribe it as "Nestle labs", "Nester labs", etc.
    - ALWAYS interpret these as "Nesterlabs". NEVER correct the user about the company name — they said it right, the transcription was inaccurate.

    RESPONSE RULES:
    1. Keep responses to 2-3 short sentences: brief answer + a follow-up question to keep the conversation engaging.
    2. ALWAYS end with a relevant follow-up question. Examples: "Would you like to hear about our projects?", "Interested in learning more about that?", "Want me to go deeper into any of these?"
    3. Answer DIRECTLY from above knowledge when possible. Do not search the knowledge base for basic info you already know.
    4. NEVER ramble or repeat yourself. Short, natural, conversational responses only.
    5. NEVER use filler phrases like "Let me check that for you", "Sure, let me look into that". Just answer directly.
    6. For farewells (bye, goodbye, see you, end call): use the farewell tool IMMEDIATELY.
    7. ALWAYS respond in English only.
    8. If asked something unrelated to the company, politely say you're focused on Nesterlabs topics.
    9. When you receive knowledge base search results, speak them naturally. Do not add "According to my knowledge base" or similar phrasing.
# A2UI (Agentic UI) Configuration
# Visual response generation system for dynamic UI components
a2ui:
  enabled: true  # Enable A2UI visual response generation
  config:
    # Tier selection mode: "auto", "semantic", or "explicit"
    # - auto: Pattern-based detection (fast, keyword matching)
    # - semantic: Uses sentence transformer for semantic matching (slower but more accurate)
    # - explicit: Only use templates when explicitly requested
    tier_mode: "auto"

    # Default template when no specific template is detected
    default_template: "simple-card"

    # Minimum confidence for template selection (0.0 - 1.0)
    min_confidence: 0.5

    # Enable streaming A2UI updates (progressive rendering)
    streaming_enabled: true

    # Buffer size before triggering A2UI generation (characters)
    buffer_threshold: 100

    # Available template types (for reference)
    # - simple-card: Basic text response card
    # - template-grid: Grid of cards for lists
    # - timeline: Chronological events
    # - contact-card: Contact information
    # - comparison-chart: Side-by-side comparison
    # - stats-flow-layout: Dashboard with KPIs
    # - team-flip-cards: Team profiles
    # - service-hover-reveal: Service listings
    # - magazine-hero: Long-form content
    # - faq-accordion: Q&A accordion
    # - image-gallery: Image galleries
    # - video-gallery: Video galleries
    # - sales-dashboard: Sales metrics

# Noise Suppression
# DISABLED - no noise suppression filter active
# To enable Koala: set enabled: true, provider: "koala", add access_key
# To enable Krisp VIVA: requires SDK download from sdk.krisp.ai
noise_suppression:
  enabled: false  # DISABLED - no noise filter
  provider: "none"
  config: {}

# Speech Enhancement (ai-coustics AIC)
# Noise reduction + speech clarity improvement
speech_enhancement:
  enabled: false  # DISABLED - Pipecat AICFilter uses SDK v1; your key is v2 (LICENSE_VERSION_UNSUPPORTED)
  provider: "aic"
  config:
    license_key: "${AIC_LICENSE_KEY}"  # Get from https://ai-coustics.com/pipecat
    model_type: 0  # Model type (0 = default)
    enhancement_level: 1.0  # Speech enhancement level (0.0-1.0)
    voice_gain: 1.0  # Voice gain multiplier
    noise_gate_enable: true  # Enable noise gate

# Server and VAD (Voice Activity Detection) settings
server:
  websocket_host: "0.0.0.0"
  websocket_port: 8765
  fastapi_host: "0.0.0.0"
  fastapi_port: 7860
  session_timeout: 180
  # Emotion detection toggle
  # Uses MSP-PODCAST wav2vec2 + Google Gemini for hybrid audio+text sentiment
  emotion_detection_enabled: true

  # VAD settings - STRICTER to prevent false barge-ins from background noise
  # Higher values = stricter (less sensitive to noise, but may miss quiet speech)
  # Lower values = more sensitive (catches quiet speech, but may pick up noise)
  vad:
    confidence: 0.8        # BALANCED - trigger on clear speech but allow interruptions
    start_secs: 0.2        # FASTER - 200ms to detect interruptions quickly
    stop_secs: 0.8         # Wait 0.8s of silence before ending utterance
    min_volume: 0.8        # BALANCED - catch normal speech volume

  # Barge-in (interruption) settings
  # MinWordsInterruptionStrategy prevents false interruptions from:
  # - Background noise picked up by VAD
  # - Short sounds like "yeah", "ok", "mm-hmm" (backchanneling)
  # With endpointing=300ms, transcriptions arrive fast so min_words must be higher
  interruption:
    enabled: true          # Enable barge-in support
    min_words: 1           # DEFERRED: require 1 transcribed word before interrupting (prevents false interruptions from late STT deliveries)

  # Smart interruption - Context-aware validation
  # Prevents false interruptions from background conversations/TV/music
  # Warns user when background noise is detected
  smart_interruption:
    enabled: false         # DISABLED - StartFrame error needs to be fixed first
    min_confidence: 0.7    # Minimum confidence for valid interruption
    warn_on_noise: false   # Warn user about background noise
    warning_cooldown: 10   # Seconds between background noise warnings

  # Smart Turn v3 - ML-based end-of-turn detection
  # Uses ONNX model to detect when user has finished speaking
  # More accurate than simple silence detection
  # Now properly integrated via LLMContextAggregatorPair with UserTurnStrategies
  smart_turn:
    enabled: true          # ENABLED - migrated to universal LLMContext with TurnAnalyzerUserTurnStopStrategy
    cpu_count: 1           # Number of CPUs for ML inference (1 is usually enough)
    timeout: 0.5           # Delay before triggering end-of-turn (seconds)
