# Voice RAG Assistant Configuration
# This file contains the main configuration structure
# Sensitive keys are loaded from environment variables

# Language configuration
language:
  primary: "en"  # Primary language (en for English)
  support_hinglish: false  # Disabled - English only
  auto_detect: false

stt:
  provider: "deepgram"
  config:
    device: "cpu"
    model: "nova-3"  # Nova 3 - Latest and most accurate Deepgram STT model
    api_key: "${DEEPGRAM_API_KEY}"
    language: "en"
    # Optimized for low latency
    smart_format: true       # Better formatting
    endpointing: 300         # 300ms silence for faster response
    utterance_end_ms: 1000   # Reduced for faster finalization
    interim_results: true    # Enable streaming for lower latency
    punctuate: true          # Better text formatting
    filler_words: false      # Remove "um", "uh" for cleaner transcripts

tts:
  provider: "deepgram"  # Using Deepgram for cost-effectiveness
  config:
    api_key: "${DEEPGRAM_API_KEY}"
    # Aura 2 voices - Latest generation with better quality
    # Female: aura-2-athena-en (natural), aura-2-hera-en (expressive), aura-2-stella-en (friendly)
    # Male: aura-2-zeus-en (authoritative), aura-2-orion-en (deep), aura-2-arcas-en (calm)
    voice: "aura-2-athena-en"    # Aura 2.0 - Natural, clear female voice
    encoding: "linear16"          # High quality audio (16-bit PCM, L16 format)
    sample_rate: 24000            # 24kHz sample rate for better quality

input_analyzer:
  custom_patterns:
    greeting:
      - '\bgood night\b'
      - '\bsup\b'
    feedback:
      - '\bawesome\b'
      - '\bperfect\b'

rag:
  type: "lightrag"  # Using external LightRAG API
  config:
    api_url: "https://lightragnl.duckdns.org"  # LightRAG server
    mode: "local"  # Query mode: local is faster than mix
    top_k: 3  # Reduced for faster response
    timeout: 20  # API timeout in seconds
    use_streaming: false  # Disabled - non-streaming is more reliable

conversation:
  llm:
    provider: "google"  # Using Google Gemini
    model: "gemini-1.5-flash-latest"  # Gemini 1.5 Flash - 1500 requests/day free tier
    api_key: "${GOOGLE_API_KEY}"

# Server and VAD (Voice Activity Detection) settings
server:
  websocket_host: "0.0.0.0"
  websocket_port: 8765
  fastapi_host: "0.0.0.0"
  fastapi_port: 7860
  session_timeout: 180
  # VAD settings optimized for low latency and responsiveness
  vad:
    confidence: 0.7        # Balanced for good detection without false positives
    start_secs: 0.2        # Faster speech detection (reduced from 0.35)
    stop_secs: 0.8         # Enough silence to avoid cutting off speech
    min_volume: 0.6        # Lower threshold for better detection
