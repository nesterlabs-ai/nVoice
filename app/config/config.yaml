# Voice RAG Assistant Configuration
# This file contains the main configuration structure
# Sensitive keys are loaded from environment variables

# Language configuration
language:
  primary: "en"  # Primary language (en for English)
  support_hinglish: false  # Disabled - English only
  auto_detect: false

stt:
  provider: "deepgram"
  config:
    device: "cpu"
    model: "nova-3"  # Nova 3 - Latest and most accurate Deepgram STT model
    api_key: "${DEEPGRAM_API_KEY}"
    language: "en"
    # Optimized for natural conversation (wait for complete sentences)
    smart_format: true       # Better formatting
    endpointing: 800         # 800ms silence - wait for user to finish speaking
    utterance_end_ms: 1500   # Wait longer to capture complete thoughts
    interim_results: true    # Enable streaming for lower latency
    punctuate: true          # Better text formatting
    filler_words: false      # Remove "um", "uh" for cleaner transcripts
    

tts:
  provider: "chatterbox"  # Chatterbox with emotion control via Resemble AI Cloud
  config:
    api_key: "${RESEMBLE_API_KEY}"
    voice_uuid: "${RESEMBLE_VOICE_UUID}"
    synthesis_url: "https://f.cluster.resemble.ai/synthesize"
    stream_url: "https://f.cluster.resemble.ai/stream"
    sample_rate: 24000
    voice: "neutral"  # Initial voice/emotion state

input_analyzer:
  custom_patterns:
    greeting:
      - '\bgood night\b'
      - '\bsup\b'
    feedback:
      - '\bawesome\b'
      - '\bperfect\b'

rag:
  type: "lightrag"  # Using external LightRAG API
  config:
    api_url: "https://nonrecessive-arlie-vexedly.ngrok-free.dev/"  # LightRAG server
    api_key: "${LIGHTRAG_API_KEY}"  # API key for authentication
    mode: "local"  # OPTIMIZED: "local" for 2-3x faster retrieval (entity-focused, was "mix")
    top_k: 10  # Number of top results to retrieve
    chunk_top_k: 10  # Number of top chunks to retrieve
    max_entity_tokens: 600  # Maximum tokens for entity extraction
    max_relation_tokens: 600  # Maximum tokens for relation extraction
    max_total_tokens: 1000  # Maximum total tokens for response
    timeout: 15  # OPTIMIZED: Reduced from 20s for faster failure detection
    use_streaming: true  # Enabled - streaming for faster retrieval
    use_connection_pooling: true  # Use shared HTTP client for connection reuse (faster)
    

conversation:
  llm:
    provider: "google"  # Using Google Gemini
    model: "gemini-2.0-flash"  # Gemini 2.0 Flash - Fast and capable
    api_key: "${GOOGLE_API_KEY}"
    temperature: 0.7  # Balanced - natural but focused responses
    max_tokens: 512  # Allow longer, more complete responses

  system_prompt: |
    You are the Nesterlabs voice assistant. VOICE MODE ONLY - respond in natural sentences, no markdown.

    COMPANY KNOWLEDGE (answer directly from this):
    - Nesterlabs is an AI-accelerated studio in Sunnyvale, California (SF Bay Area)
    - Focus: AI product development, voice AI, conversational interfaces
    - 85+ years combined team experience
    - Clients: Early-stage startups to large enterprises

    SERVICES (4 pillars):
    - HUMAN: User research, product design, voice/emotion design, brand identity
    - INTELLIGENCE: Agentic AI, NLP engines, conversational AI systems
    - MEMORY: Knowledge graphs, RAG pipelines, context management, privacy/compliance
    - CLOUD: Infrastructure security, DevOps, CI/CD for AI platforms

    EXPERTISE AREAS:
    - Voice AI and Conversational Interfaces
    - Agentic AI and Orchestration
    - RAG and Context Engineering
    - Natural Language Processing
    - AI-First Product Design
    - Knowledge Graphs and Memory Systems

    CONTACT INFO:
    - Email: contact@nesterlabs.com
    - Phone: +1 (408) 673-1340
    - Address: 701 Lakeway Dr #200, Sunnyvale CA 94085
    - Website: nesterlabs.com

    RESPONSE RULES:
    1. Answer simple questions DIRECTLY from above knowledge (1-2 sentences)
    2. Call call_rag_system ONLY when user wants MORE DETAILS about:
       - Specific projects or case studies
       - In-depth service explanations
       - Detailed expertise information
       - "Tell me more about...", "Can you explain...", "What projects..."
    3. For farewells (bye, goodbye, etc): call end_conversation IMMEDIATELY
    4. Keep all responses brief and conversational

# A2UI (Agentic UI) Configuration
# Visual response generation system for dynamic UI components
a2ui:
  enabled: true  # Enable A2UI visual response generation
  config:
    # Tier selection mode: "auto", "semantic", or "explicit"
    # - auto: Pattern-based detection (fast, keyword matching)
    # - semantic: Uses sentence transformer for semantic matching (slower but more accurate)
    # - explicit: Only use templates when explicitly requested
    tier_mode: "auto"

    # Default template when no specific template is detected
    default_template: "simple-card"

    # Minimum confidence for template selection (0.0 - 1.0)
    min_confidence: 0.5

    # Enable streaming A2UI updates (progressive rendering)
    streaming_enabled: true

    # Buffer size before triggering A2UI generation (characters)
    buffer_threshold: 100

    # Available template types (for reference)
    # - simple-card: Basic text response card
    # - template-grid: Grid of cards for lists
    # - timeline: Chronological events
    # - contact-card: Contact information
    # - comparison-chart: Side-by-side comparison
    # - stats-flow-layout: Dashboard with KPIs
    # - team-flip-cards: Team profiles
    # - service-hover-reveal: Service listings
    # - magazine-hero: Long-form content
    # - faq-accordion: Q&A accordion
    # - image-gallery: Image galleries
    # - video-gallery: Video galleries
    # - sales-dashboard: Sales metrics

# Server and VAD (Voice Activity Detection) settings
server:
  websocket_host: "0.0.0.0"
  websocket_port: 8765
  fastapi_host: "0.0.0.0"
  fastapi_port: 7860
  session_timeout: 180
  # Emotion detection toggle
  # Uses MSP-PODCAST wav2vec2 + Google Gemini for hybrid audio+text sentiment
  emotion_detection_enabled: true

  # VAD settings - BALANCED to reduce false interruptions from background noise
  # Higher values = stricter (less sensitive to noise, but may miss quiet speech)
  # Lower values = more sensitive (catches quiet speech, but may pick up noise)
  vad:
    confidence: 0.85       # HIGH - only trigger on clear speech (reduces noise triggers)
    start_secs: 0.4        # SLOWER - require 400ms of speech before triggering (filters short noises)
    stop_secs: 1.0         # Wait 1s of silence before ending utterance
    min_volume: 0.6        # MEDIUM - ignore quiet background noise
