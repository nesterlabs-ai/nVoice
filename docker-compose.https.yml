# Docker Compose with Caddy for HTTPS
# Use this instead of docker-compose.yml for HTTPS deployment

version: '3.8'

services:
  # Caddy - Reverse Proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: nester-caddy
    restart: always
    ports:
      - "80:80"      # HTTP (redirects to HTTPS)
      - "443:443"    # HTTPS
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # SSL certificates
      - caddy_config:/config    # Caddy config
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 20M
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nester-network

  # Backend - Python FastAPI + Pipecat Voice Assistant
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nester-backend
    # Ports NOT exposed externally - only through Caddy
    expose:
      - "7860"
      - "8765"
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX}
      - PUBLIC_URL=${PUBLIC_URL}
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=7860
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8765
      - WEBSOCKET_SERVER=fast_api
      - SESSION_TIMEOUT=180
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 200M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - nester-network

  # Frontend - Nginx serving static files
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nester-frontend
    # Port NOT exposed externally - only through Caddy
    expose:
      - "80"
    environment:
      - BACKEND_URL=${PUBLIC_URL}
    deploy:
      resources:
        limits:
          memory: 50M
        reservations:
          memory: 10M
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - nester-network

networks:
  nester-network:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

