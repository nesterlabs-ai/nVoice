name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AWS_REGION: ap-south-1
  IMAGE_NAME: nesteraibot

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image outputs
        id: image_outputs
        run: |
          echo "backend_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/nester-bot || mkdir -p ~/nester-bot && cd ~/nester-bot
            
            # === EXPORT ENVIRONMENT VARIABLES ===
            export AWS_REGION="${{ env.AWS_REGION }}"
            export IMAGE_TAG="${{ github.sha }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export GHCR_USER="${{ github.repository_owner }}"
            export PUBLIC_URL="${{ secrets.PUBLIC_URL }}"
            
            # === PORT 80 CLEANUP FIRST (CRITICAL) ===
            echo "🧹 Step 1: Cleaning port 80 conflicts..."
            sudo fuser -k 80/tcp 2>/dev/null || true
            docker ps -q --filter "publish=80" | xargs -r docker rm -f 2>/dev/null || true
            docker-compose -f docker-compose.https.yml down --remove-orphans 2>/dev/null || true
            sleep 2
            
            # === CREATE DEPLOYMENT SCRIPT (ALWAYS - NO GIT DEPENDENCY) ===
            echo "📝 Step 2: Creating deployment script (no git needed)..."
            mkdir -p scripts
            rm -f lightsail-deploy.sh  # Remove old root script
            
            cat > scripts/lightsail-deploy.sh << 'DEPLOY_SCRIPT_EOF'
            #!/bin/bash
            set -eo pipefail  # Removed -u to allow unset variables (they're checked explicitly)
            
            echo "=== NesterAIBot GHCR Deploy ==="
            
            cd ~/nester-bot || exit 1
            
            # Port cleanup
            echo "🔍 Cleaning port 80..."
            sudo fuser -k 80/tcp 2>/dev/null || true
            docker ps -q --filter "publish=80" | xargs -r docker rm -f 2>/dev/null || true
            sleep 2
            
            # Docker login
            echo "🔑 Logging into GHCR..."
            if [ -z "${GHCR_TOKEN:-}" ] || [ -z "${GHCR_USER:-}" ]; then
              echo "❌ GHCR_TOKEN or GHCR_USER not set"
              echo "GHCR_TOKEN: ${GHCR_TOKEN:+SET}"
              echo "GHCR_USER: ${GHCR_USER:+SET}"
              exit 1
            fi
            
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || {
              echo "❌ Failed to login to GHCR"
              exit 1
            }
            
            # Fetch secrets
            echo "🔐 Fetching secrets..."
            SECRET_NAME="nester/voice-bot/secrets"
            SECRET_JSON=$(aws secretsmanager get-secret-value \
              --secret-id "$SECRET_NAME" \
              --region "${AWS_REGION:-ap-south-1}" \
              --query SecretString \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$SECRET_JSON" ]; then
              echo "✅ Fetched secrets"
              # Create .env from JSON
              if command -v jq &> /dev/null; then
                echo "$SECRET_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env
              else
                TEMP_JSON=$(mktemp)
                echo "$SECRET_JSON" > "$TEMP_JSON"
                python3 -c "import json; d=json.load(open('$TEMP_JSON')); [print(f'{k}={v}') for k,v in sorted(d.items()) if v]" > .env
                rm -f "$TEMP_JSON"
              fi
              chmod 600 .env
            else
              echo "⚠️  Could not fetch secrets, checking for existing .env..."
              if [ ! -f .env ]; then
                echo "❌ No .env file and secrets fetch failed"
                exit 1
              fi
            fi
            
            # Ensure docker-compose.https.yml exists (create minimal if missing)
            if [ ! -f docker-compose.https.yml ]; then
              echo "⚠️  docker-compose.https.yml not found, creating minimal version..."
              cat > docker-compose.https.yml << 'COMPOSE_EOF'
            services:
              caddy:
                image: caddy:2-alpine
                container_name: nester-caddy
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./Caddyfile:/etc/caddy/Caddyfile:ro
                  - caddy_data:/data
                  - caddy_config:/config
                networks:
                  - nester-network
              
              backend:
                image: ghcr.io/nesterlabs-ai/nesteraibot-backend:${IMAGE_TAG:-latest}
                container_name: nester-backend
                restart: always
                env_file:
                  - .env
                expose:
                  - "7860"
                  - "8765"
                networks:
                  - nester-network
              
              frontend:
                image: ghcr.io/nesterlabs-ai/nesteraibot-frontend:${IMAGE_TAG:-latest}
                container_name: nester-frontend
                restart: always
                expose:
                  - "80"
                networks:
                  - nester-network
                depends_on:
                  - backend
            
            networks:
              nester-network:
                driver: bridge
            
            volumes:
              caddy_data:
              caddy_config:
            COMPOSE_EOF
            fi
            
            # Update image tags if needed
            if [ -n "$IMAGE_TAG" ] && [ "$IMAGE_TAG" != "latest" ]; then
              IMAGE_TAG_SHORT=$(echo "$IMAGE_TAG" | cut -c1-7)
              echo "📌 Using image tag: $IMAGE_TAG_SHORT"
              sed -i "s|:latest|:$IMAGE_TAG_SHORT|g" docker-compose.https.yml || true
            fi
            
            # Pull and deploy
            echo "📥 Pulling images..."
            export IMAGE_TAG
            docker-compose -f docker-compose.https.yml pull || {
              echo "⚠️  Pull failed, but continuing..."
            }
            
            echo "🚀 Deploying containers..."
            docker-compose -f docker-compose.https.yml down --remove-orphans || true
            docker-compose -f docker-compose.https.yml up -d --remove-orphans || {
              echo "❌ Failed to start containers"
              echo "Checking port 80..."
              docker ps --filter "publish=80" || true
              sudo netstat -tlnp 2>/dev/null | grep ':80 ' || true
              exit 1
            }
            
            echo "⏳ Waiting for services..."
            sleep 20
            
            echo "✅ Deploy complete"
            docker ps
            DEPLOY_SCRIPT_EOF
            
            chmod +x scripts/lightsail-deploy.sh
            echo "✅ Deployment script created"
            
            # === EXECUTE DEPLOYMENT (NO GIT DEPENDENCY) ===
            echo "🚀 Step 3: Executing deployment..."
            bash scripts/lightsail-deploy.sh

  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [build, deploy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Health Check
        run: |
          PUBLIC_URL="${{ secrets.PUBLIC_URL }}"
          MAX_RETRIES=5
          RETRY_DELAY=15
          
          echo "🔍 Performing health check on: ${PUBLIC_URL}/health"
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --insecure "${PUBLIC_URL}/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            else
              echo "⚠️  Health check failed (HTTP $HTTP_CODE)"
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Fetch Container Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "=== Backend Container Logs (last 50 lines) ==="
            docker logs --tail 50 nester-backend 2>&1 || echo "Could not fetch backend logs"
            
            echo ""
            echo "=== Container Status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            
            echo ""
            echo "=== Recent Errors (if any) ==="
            docker logs --tail 100 nester-backend 2>&1 | grep -i error | tail -10 || echo "No errors found"
