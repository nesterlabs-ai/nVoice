name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nesteraibot-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nesteraibot-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/nester-bot
            
            echo "Pulling latest code..."
            git pull origin main
            
            echo "Fetching secrets from AWS Parameter Store..."
            REGION="ap-south-1"
            DEEPGRAM=$(aws ssm get-parameter --name "/nester/DEEPGRAM_API_KEY" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            OPENAI=$(aws ssm get-parameter --name "/nester/OPENAI_API_KEY" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            GOOGLE=$(aws ssm get-parameter --name "/nester/GOOGLE_API_KEY" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            ELEVENLABS=$(aws ssm get-parameter --name "/nester/ELEVENLABS_API_KEY" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            ELEVENLABS_VOICE=$(aws ssm get-parameter --name "/nester/ELEVENLABS_VOICE_ID" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            PINECONE=$(aws ssm get-parameter --name "/nester/PINECONE_API_KEY" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            PINECONE_IDX=$(aws ssm get-parameter --name "/nester/PINECONE_INDEX" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            LIGHTRAG=$(aws ssm get-parameter --name "/nester/LIGHTRAG_API_KEY" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            PUBLIC=$(aws ssm get-parameter --name "/nester/PUBLIC_URL" --with-decryption --region $REGION --query "Parameter.Value" --output text)
            DOMAIN_VAL=$(aws ssm get-parameter --name "/nester/DOMAIN" --with-decryption --region $REGION --query "Parameter.Value" --output text 2>/dev/null || echo "localhost")

            echo "DEEPGRAM_API_KEY=$DEEPGRAM" > .env
            echo "OPENAI_API_KEY=$OPENAI" >> .env
            echo "GOOGLE_API_KEY=$GOOGLE" >> .env
            echo "ELEVENLABS_API_KEY=$ELEVENLABS" >> .env
            echo "ELEVENLABS_VOICE_ID=$ELEVENLABS_VOICE" >> .env
            echo "PINECONE_API_KEY=$PINECONE" >> .env
            echo "PINECONE_INDEX=$PINECONE_IDX" >> .env
            echo "LIGHTRAG_API_KEY=$LIGHTRAG" >> .env
            echo "PUBLIC_URL=$PUBLIC" >> .env
            echo "DOMAIN=$DOMAIN_VAL" >> .env
            echo "FASTAPI_HOST=0.0.0.0" >> .env
            echo "FASTAPI_PORT=7860" >> .env
            echo "WEBSOCKET_HOST=0.0.0.0" >> .env
            echo "WEBSOCKET_PORT=8765" >> .env
            echo "WEBSOCKET_SERVER=fast_api" >> .env
            echo "SESSION_TIMEOUT=180" >> .env
            echo "LOG_LEVEL=INFO" >> .env
            chmod 600 .env

            echo "Created .env with DOMAIN=$DOMAIN_VAL"
            cat .env | grep DOMAIN

            echo "Logging into GitHub Container Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin || echo "GHCR login failed"
            
            echo "Updating docker-compose.https.yml to use GHCR images..."
            # The file in repo already has GHCR images, but server might have old version
            # Use Python to properly update the YAML file
            python3 << 'PYTHON_SCRIPT'
import yaml
import sys

try:
    with open('docker-compose.https.yml', 'r') as f:
        compose = yaml.safe_load(f)
    
    # Update backend
    if 'services' in compose and 'backend' in compose['services']:
        if 'build' in compose['services']['backend']:
            del compose['services']['backend']['build']
        compose['services']['backend']['image'] = 'ghcr.io/nesterlabs-ai/nesteraibot-backend:latest'
    
    # Update frontend
    if 'services' in compose and 'frontend' in compose['services']:
        if 'build' in compose['services']['frontend']:
            del compose['services']['frontend']['build']
        compose['services']['frontend']['image'] = 'ghcr.io/nesterlabs-ai/nesteraibot-frontend:latest'
    
    with open('docker-compose.https.yml', 'w') as f:
        yaml.dump(compose, f, default_flow_style=False, sort_keys=False)
    
    print("✅ Updated docker-compose.https.yml to use GHCR images")
except Exception as e:
    print(f"⚠️  Python update failed: {e}")
    print("Falling back to sed method...")
    # Fallback to sed if Python fails
    import subprocess
    subprocess.run(['sed', '-i', 's|build:.*|image: ghcr.io/nesterlabs-ai/nesteraibot-backend:latest|g', 'docker-compose.https.yml'], check=False)
    subprocess.run(['sed', '-i', '/context: \./d', 'docker-compose.https.yml'], check=False)
    subprocess.run(['sed', '-i', '/dockerfile: Dockerfile/d', 'docker-compose.https.yml'], check=False)
PYTHON_SCRIPT
            
            echo "Verifying docker-compose.https.yml uses GHCR images..."
            grep -E "image: ghcr.io" docker-compose.https.yml || echo "⚠️  Warning: GHCR images not found in file"
            
            echo "Pulling latest images..."
            docker-compose -f docker-compose.https.yml pull || echo "⚠️  Image pull failed - may need authentication"

            echo "Restarting containers with HTTPS..."
            docker-compose -f docker-compose.https.yml down || true
            docker-compose -f docker-compose.https.yml up -d

            echo "Waiting for services to start..."
            sleep 30

            echo "Reloading Caddy configuration..."
            docker exec nester-caddy caddy reload --config /etc/caddy/Caddyfile || echo "Caddy reload not needed"

            echo "Checking service health..."
            docker-compose -f docker-compose.https.yml ps

            echo "Setting up CloudWatch Agent for log collection..."
            if [ ! -f "/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent" ]; then
                echo "Installing CloudWatch Agent..."
                cd /tmp
                wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
                sudo dpkg -i -E ./amazon-cloudwatch-agent.deb || echo "CloudWatch agent installation failed or already installed"
                
                # Create log groups
                aws logs create-log-group --log-group-name "/lightsail/nester-docker" --region ap-south-1 2>/dev/null || true
                aws logs create-log-group --log-group-name "/lightsail/nester-system" --region ap-south-1 2>/dev/null || true
                
                # Copy config if it exists
                if [ -f ~/nester-bot/scripts/cloudwatch-agent-config.json ]; then
                    sudo cp ~/nester-bot/scripts/cloudwatch-agent-config.json /opt/aws/amazon-cloudwatch-agent/bin/config.json
                    sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json -s || echo "CloudWatch agent start failed"
                fi
            else
                echo "CloudWatch Agent already installed"
            fi

            echo "Deployment complete!"
