name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AWS_REGION: ap-south-1
  IMAGE_NAME: nesteraibot

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image outputs
        id: image_outputs
        run: |
          echo "backend_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: AWS_REGION,IMAGE_TAG,GHCR_TOKEN,GHCR_USER,PUBLIC_URL
          script: |
            export AWS_REGION="${{ env.AWS_REGION }}"
            export IMAGE_TAG="${{ github.sha }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export GHCR_USER="${{ github.repository_owner }}"
            export PUBLIC_URL="${{ secrets.PUBLIC_URL }}"
            
            cd ~/nester-bot
            
            # Robust git normalization - ensures clean state regardless of prior state
            echo "=== Git Repository Normalization ==="
            
            # Initialize git if no repo exists
            if [ ! -d .git ]; then
              echo "📦 Initializing git repository..."
              git init
            fi
            
            # Set origin with token authentication (if repo is private)
            echo "🔗 Setting remote origin..."
            git remote remove origin 2>/dev/null || true
            
            # Use token in URL if available, otherwise use public URL
            # Note: GITHUB_TOKEN is automatically available in GitHub Actions
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            if [ -n "$GITHUB_TOKEN" ]; then
              GIT_REPO_URL="https://${GITHUB_TOKEN}@github.com/nesterlabs-ai/NesterAIBot.git"
              echo "Using authenticated URL for private repo"
            else
              GIT_REPO_URL="https://github.com/nesterlabs-ai/NesterAIBot.git"
              echo "Using public URL"
            fi
            
            git remote add origin "$GIT_REPO_URL"
            
            # Configure git to avoid prompts
            export GIT_TERMINAL_PROMPT=0
            export GIT_ASKPASS=echo
            git config --global credential.helper store || true
            
            # Fetch with prune to clean up old refs and get latest
            echo "📥 Fetching latest code (pruning old refs)..."
            FETCH_SUCCESS=false
            
            # Try fetch with authenticated URL
            if git fetch --prune origin main 2>&1; then
              FETCH_SUCCESS=true
              echo "✅ Fetch successful"
            else
              echo "⚠️  Fetch with prune failed, trying without prune..."
              if git fetch origin main 2>&1; then
                FETCH_SUCCESS=true
                echo "✅ Fetch successful (without prune)"
              else
                echo "⚠️  Standard fetch failed, trying with full URL..."
                if git fetch --prune "$GIT_REPO_URL" main 2>&1; then
                  FETCH_SUCCESS=true
                  echo "✅ Fetch successful (with full URL)"
                else
                  echo "❌ All fetch attempts failed"
                fi
              fi
            fi
            
            # If fetch failed, try to get latest commit SHA from GitHub API
            if [ "$FETCH_SUCCESS" = false ]; then
              echo "⚠️  Fetch failed, attempting to get latest commit via GitHub API..."
              LATEST_SHA=$(curl -s -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/nesterlabs-ai/NesterAIBot/commits/main \
                | grep -o '"sha":"[^"]*' | head -1 | cut -d'"' -f4) || LATEST_SHA=""
              
              if [ -n "$LATEST_SHA" ]; then
                echo "📌 Latest commit SHA: ${LATEST_SHA:0:7}"
                # Try to fetch specific commit
                git fetch "$GIT_REPO_URL" "$LATEST_SHA" 2>&1 || true
              fi
            fi
            
            # Also fetch all refs to ensure we have latest
            echo "📥 Fetching all refs..."
            git fetch --prune --all 2>/dev/null || true
            
            # Verify we have the latest refs
            echo "📋 Remote refs after fetch:"
            git ls-remote origin main 2>/dev/null | head -1 || echo "  Could not list remote refs"
            
            # Force checkout/create main branch tracking origin/main
            # -B creates branch if it doesn't exist, or resets if it does
            echo "🌿 Checking out main branch (force create/reset)..."
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              git checkout -B main origin/main || {
                echo "⚠️  Checkout failed, trying alternative approach..."
                git branch -D main 2>/dev/null || true
                git checkout -b main origin/main
              }
            else
              echo "⚠️  origin/main ref not found, checking out latest commit..."
              # If origin/main doesn't exist, try to checkout the latest commit we have
              LATEST_LOCAL=$(git log --all --format="%H" | head -1)
              if [ -n "$LATEST_LOCAL" ]; then
                git checkout -B main "$LATEST_LOCAL" || git checkout -b main "$LATEST_LOCAL"
              else
                echo "❌ No commits found locally"
              fi
            fi
            
            # Hard reset to ensure clean state matching origin/main exactly
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              echo "🔄 Resetting to origin/main (hard reset)..."
              git reset --hard origin/main
            else
              echo "⚠️  origin/main not available, resetting to current HEAD..."
              git reset --hard HEAD
            fi
            
            # Diagnostic information (keep for troubleshooting)
            echo ""
            echo "=== Git State Diagnostics ==="
            CURRENT_COMMIT=$(git rev-parse HEAD)
            CURRENT_COMMIT_SHORT=$(git log -1 --oneline)
            CURRENT_BRANCH=$(git branch --show-current)
            REMOTE_TRACKING=$(git rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null || echo "none")
            
            echo "📍 Current directory: $(pwd)"
            echo "🌿 Current branch: ${CURRENT_BRANCH}"
            echo "🔗 Remote tracking: ${REMOTE_TRACKING}"
            echo "📌 Current commit (full): ${CURRENT_COMMIT}"
            echo "📌 Current commit (short): ${CURRENT_COMMIT_SHORT}"
            echo "🔀 Branch status:"
            git status --short --branch | head -3
            echo ""
            
            # Verify script exists (check both locations)
            echo "=== Deployment Script Verification ==="
            SCRIPT_PATH=""
            if [ -f scripts/lightsail-deploy.sh ]; then
              SCRIPT_PATH="scripts/lightsail-deploy.sh"
            elif [ -f lightsail-deploy.sh ]; then
              SCRIPT_PATH="lightsail-deploy.sh"
              echo "⚠️  Found script in root, should be in scripts/ directory"
            fi
            
            if [ -n "$SCRIPT_PATH" ]; then
              chmod +x "$SCRIPT_PATH"
              SCRIPT_LINES=$(wc -l < "$SCRIPT_PATH")
              SCRIPT_SIZE=$(wc -c < "$SCRIPT_PATH")
              echo "✅ Found $SCRIPT_PATH"
              echo "   Lines: ${SCRIPT_LINES}"
              echo "   Size: ${SCRIPT_SIZE} bytes"
              echo ""
              echo "=== Starting Deployment ==="
              bash "$SCRIPT_PATH"
            else
              echo "❌ Error: lightsail-deploy.sh not found in scripts/ or root"
              echo ""
              echo "=== Diagnostic Information ==="
              echo "Current directory: $(pwd)"
              echo "Current branch: ${CURRENT_BRANCH}"
              echo "Current commit: ${CURRENT_COMMIT_SHORT}"
              echo "Remote URL: $(git remote get-url origin | sed 's/\/\/.*@/\/\/***@/')"
              echo "Origin/main commit: $(git rev-parse origin/main 2>/dev/null || echo 'not found')"
              echo ""
              echo "Remote branches:"
              git branch -r | head -5
              echo ""
              echo "Files in scripts/ directory:"
              ls -la scripts/ 2>/dev/null || echo "  scripts/ directory not found"
              echo ""
              echo "All .sh files in repository:"
              find . -name "*.sh" -type f 2>/dev/null | head -15 || echo "  No .sh files found"
              echo ""
              echo "Recent commits (last 10):"
              git log --oneline -10
              echo ""
              echo "Files changed in current commit:"
              git diff-tree --no-commit-id --name-only -r HEAD | head -10
              echo ""
              echo "Checking if script exists in latest commit on GitHub:"
              git ls-tree -r HEAD --name-only | grep -i lightsail || echo "  Not found in current HEAD"
              echo ""
              echo ""
              echo "=== Attempting inline deployment as fallback ==="
              echo "Since script not found, running deployment steps inline..."
              
              # Inline deployment as fallback (same logic as lightsail-deploy.sh)
              set +e  # Allow errors for fallback
              
              # Step 1: Git sync (already done above, but verify)
              echo "Step 1: Verifying git sync..."
              echo "Current commit: $(git log -1 --oneline 2>/dev/null || echo 'unknown')"
              
              # Step 2: Fetch secrets
              echo ""
              echo "Step 2: Fetching secrets from AWS Secrets Manager..."
              if [ -f scripts/fetch-secrets.sh ]; then
                bash scripts/fetch-secrets.sh .env || {
                  echo "⚠️  fetch-secrets.sh failed, but continuing..."
                }
              else
                echo "⚠️  fetch-secrets.sh not found"
                echo "Attempting to fetch secrets directly..."
                # Direct secret fetching as fallback
                SECRET_NAME="nester/voice-bot/secrets"
                SECRET_JSON=$(aws secretsmanager get-secret-value \
                  --secret-id "$SECRET_NAME" \
                  --region "$AWS_REGION" \
                  --query SecretString \
                  --output text 2>/dev/null || echo "")
                
                if [ -n "$SECRET_JSON" ]; then
                  echo "✅ Fetched secrets directly"
                  # Create .env from JSON using Python
                  python3 -c "
import json
import sys
secret_data = json.loads('''$SECRET_JSON''')
for key, value in sorted(secret_data.items()):
    if value:
        print(f'{key}={value}')
" > .env
                  chmod 600 .env
                else
                  echo "⚠️  Could not fetch secrets, using existing .env if present"
                fi
              fi
              
              # Step 3: Docker login
              echo ""
              echo "Step 3: Authenticating with GitHub Container Registry..."
              if [ -z "$GHCR_TOKEN" ] || [ -z "$GHCR_USER" ]; then
                echo "❌ GHCR_TOKEN or GHCR_USER not set"
                exit 1
              fi
              
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || {
                echo "❌ Failed to login to GHCR"
                exit 1
              }
              
              # Step 4: Pull images
              echo ""
              echo "Step 4: Pulling latest Docker images..."
              if [ ! -f docker-compose.https.yml ]; then
                echo "❌ docker-compose.https.yml not found"
                exit 1
              fi
              
              # Update IMAGE_TAG in compose file if needed
              export IMAGE_TAG
              if [ "$IMAGE_TAG" != "latest" ]; then
                echo "Updating image tags to: $IMAGE_TAG"
                sed -i "s|:latest|:$IMAGE_TAG|g" docker-compose.https.yml || true
              fi
              
              docker-compose -f docker-compose.https.yml pull || {
                echo "⚠️  Pull failed, but continuing..."
              }
              
              # Step 5: Deploy containers
              echo ""
              echo "Step 5: Deploying containers..."
              docker-compose -f docker-compose.https.yml down || true
              docker-compose -f docker-compose.https.yml up -d || {
                echo "❌ Failed to start containers"
                exit 1
              }
              
              # Step 6: Wait and check status
              echo ""
              echo "Step 6: Waiting for services..."
              sleep 20
              docker-compose -f docker-compose.https.yml ps
              
              echo ""
              echo "✅ Deployment complete (inline fallback)"
            fi

  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [build, deploy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Health Check
        run: |
          PUBLIC_URL="${{ secrets.PUBLIC_URL }}"
          MAX_RETRIES=5
          RETRY_DELAY=15
          
          echo "🔍 Performing health check on: ${PUBLIC_URL}/health"
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --insecure "${PUBLIC_URL}/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            else
              echo "⚠️  Health check failed (HTTP $HTTP_CODE)"
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Fetch Container Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "=== Backend Container Logs (last 50 lines) ==="
            docker logs --tail 50 nester-backend 2>&1 || echo "Could not fetch backend logs"
            
            echo ""
            echo "=== Container Status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            
            echo ""
            echo "=== Recent Errors (if any) ==="
            docker logs --tail 100 nester-backend 2>&1 | grep -i error | tail -10 || echo "No errors found"
