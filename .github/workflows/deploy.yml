name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AWS_REGION: ap-south-1
  IMAGE_NAME: nesteraibot

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image outputs
        id: image_outputs
        run: |
          echo "backend_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/nester-bot
            
            # === PORT 80 CLEANUP FIRST ===
            echo "🧹 Cleaning port 80 conflicts..."
            sudo fuser -k 80/tcp 2>/dev/null || true
            docker ps -q --filter "publish=80" | xargs -r docker rm -f 2>/dev/null || true
            docker-compose -f docker-compose.https.yml down --remove-orphans --rmi all -t 10 2>/dev/null || true
            
            # === FORCE GIT SYNC ===
            echo "🔄 Force syncing git repository..."
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/nesterlabs-ai/NesterAIBot.git || git remote set-url origin https://github.com/nesterlabs-ai/NesterAIBot.git
            else
              git remote set-url origin https://github.com/nesterlabs-ai/NesterAIBot.git
            fi
            
            export GIT_TERMINAL_PROMPT=0
            git fetch origin main || git fetch origin main
            git reset --hard origin/main
            git checkout main
            
            # === REMOVE OLD ROOT SCRIPT ===
            echo "🗑️  Removing old root lightsail-deploy.sh if exists..."
            rm -f lightsail-deploy.sh
            
            # === VERIFY CORRECT SCRIPT ===
            if [ ! -f "scripts/lightsail-deploy.sh" ]; then
              echo "❌ scripts/lightsail-deploy.sh missing after git sync!"
              echo "Current commit: $(git log -1 --oneline)"
              ls -la *.sh scripts/*.sh 2>/dev/null || true
              git log --oneline -5
              exit 1
            fi
            
            # === EXECUTE ONLY CORRECT SCRIPT ===
            echo "✅ Executing scripts/lightsail-deploy.sh"
            chmod +x scripts/lightsail-deploy.sh
            bash scripts/lightsail-deploy.sh
              echo "❌ Error: lightsail-deploy.sh not found in scripts/ or root"
              echo ""
              echo "=== Diagnostic Information ==="
              echo "Current directory: $(pwd)"
              echo "Current branch: ${CURRENT_BRANCH}"
              echo "Current commit: ${CURRENT_COMMIT_SHORT}"
              echo "Remote URL: $(git remote get-url origin | sed 's/\/\/.*@/\/\/***@/')"
              echo "Origin/main commit: $(git rev-parse origin/main 2>/dev/null || echo 'not found')"
              echo ""
              echo "Remote branches:"
              git branch -r | head -5
              echo ""
              echo "Files in scripts/ directory:"
              ls -la scripts/ 2>/dev/null || echo "  scripts/ directory not found"
              echo ""
              echo "All .sh files in repository:"
              find . -name "*.sh" -type f 2>/dev/null | head -15 || echo "  No .sh files found"
              echo ""
              echo "Recent commits (last 10):"
              git log --oneline -10
              echo ""
              echo "Files changed in current commit:"
              git diff-tree --no-commit-id --name-only -r HEAD | head -10
              echo ""
              echo "Checking if script exists in latest commit on GitHub:"
              git ls-tree -r HEAD --name-only | grep -i lightsail || echo "  Not found in current HEAD"
              echo ""
              echo ""
              echo "=== Attempting inline deployment as fallback ==="
              echo "Since script not found, running deployment steps inline..."
              
              # Inline deployment as fallback (same logic as lightsail-deploy.sh)
              set +e  # Allow errors for fallback
              
              # Step 1: Git sync (already done above, but verify)
              echo "Step 1: Verifying git sync..."
              echo "Current commit: $(git log -1 --oneline 2>/dev/null || echo 'unknown')"
              
              # Step 2: Fetch secrets
              echo ""
              echo "Step 2: Fetching secrets from AWS Secrets Manager..."
              if [ -f scripts/fetch-secrets.sh ]; then
                bash scripts/fetch-secrets.sh .env || {
                  echo "⚠️  fetch-secrets.sh failed, but continuing..."
                }
              else
                echo "⚠️  fetch-secrets.sh not found"
                echo "Attempting to fetch secrets directly..."
                # Direct secret fetching as fallback
                SECRET_NAME="nester/voice-bot/secrets"
                SECRET_JSON=$(aws secretsmanager get-secret-value \
                  --secret-id "$SECRET_NAME" \
                  --region "$AWS_REGION" \
                  --query SecretString \
                  --output text 2>/dev/null || echo "")
                
                if [ -n "$SECRET_JSON" ]; then
                  echo "✅ Fetched secrets directly"
                  # Create .env from JSON using Python (write to temp file first)
                  TEMP_JSON=$(mktemp)
                  echo "$SECRET_JSON" > "$TEMP_JSON"
                  python3 -c "import json; import sys; data = json.load(open('$TEMP_JSON')); [print(f'{k}={v}') for k, v in sorted(data.items()) if v]" > .env
                  rm -f "$TEMP_JSON"
                  chmod 600 .env
                else
                  echo "⚠️  Could not fetch secrets, using existing .env if present"
                fi
              fi
              
              # Step 3: Docker login
              echo ""
              echo "Step 3: Authenticating with GitHub Container Registry..."
              if [ -z "$GHCR_TOKEN" ] || [ -z "$GHCR_USER" ]; then
                echo "❌ GHCR_TOKEN or GHCR_USER not set"
                exit 1
              fi
              
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || {
                echo "❌ Failed to login to GHCR"
                exit 1
              }
              
              # Step 4: Pull images
              echo ""
              echo "Step 4: Pulling latest Docker images..."
              if [ ! -f docker-compose.https.yml ]; then
                echo "❌ docker-compose.https.yml not found"
                exit 1
              fi
              
              # Update IMAGE_TAG in compose file if needed
              export IMAGE_TAG
              if [ "$IMAGE_TAG" != "latest" ]; then
                echo "Updating image tags to: $IMAGE_TAG"
                sed -i "s|:latest|:$IMAGE_TAG|g" docker-compose.https.yml || true
              fi
              
              docker-compose -f docker-compose.https.yml pull || {
                echo "⚠️  Pull failed, but continuing..."
              }
              
              # Step 5: Deploy containers
              echo ""
              echo "Step 5: Deploying containers..."
              docker-compose -f docker-compose.https.yml down || true
              docker-compose -f docker-compose.https.yml up -d || {
                echo "❌ Failed to start containers"
                exit 1
              }
              
              # Step 6: Wait and check status
              echo ""
              echo "Step 6: Waiting for services..."
              sleep 20
              docker-compose -f docker-compose.https.yml ps
              
              echo ""
              echo "✅ Deployment complete (inline fallback)"
            fi

  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [build, deploy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Health Check
        run: |
          PUBLIC_URL="${{ secrets.PUBLIC_URL }}"
          MAX_RETRIES=5
          RETRY_DELAY=15
          
          echo "🔍 Performing health check on: ${PUBLIC_URL}/health"
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --insecure "${PUBLIC_URL}/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            else
              echo "⚠️  Health check failed (HTTP $HTTP_CODE)"
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Fetch Container Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "=== Backend Container Logs (last 50 lines) ==="
            docker logs --tail 50 nester-backend 2>&1 || echo "Could not fetch backend logs"
            
            echo ""
            echo "=== Container Status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            
            echo ""
            echo "=== Recent Errors (if any) ==="
            docker logs --tail 100 nester-backend 2>&1 | grep -i error | tail -10 || echo "No errors found"
