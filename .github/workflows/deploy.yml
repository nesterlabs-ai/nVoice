name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/akkupratap323/nestervoiceai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ghcr.io/akkupratap323/nestervoiceai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: DEEPGRAM_API_KEY,OPENAI_API_KEY,GOOGLE_API_KEY,ELEVENLABS_API_KEY,ELEVENLABS_VOICE_ID,PINECONE_API_KEY,PINECONE_INDEX,PUBLIC_URL
          script: |
            cd ~/nester-bot
            
            echo "Pulling latest code..."
            git pull origin main
            
            echo "Creating .env from GitHub Secrets..."
            cat > .env << EOF
            # Auto-generated from GitHub Secrets
            DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            GOOGLE_API_KEY=${GOOGLE_API_KEY}
            ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
            ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
            PINECONE_API_KEY=${PINECONE_API_KEY}
            PINECONE_INDEX=${PINECONE_INDEX}
            PUBLIC_URL=${PUBLIC_URL}
            FASTAPI_HOST=0.0.0.0
            FASTAPI_PORT=7860
            WEBSOCKET_HOST=0.0.0.0
            WEBSOCKET_PORT=8765
            WEBSOCKET_SERVER=websocket_server
            SESSION_TIMEOUT=180
            LOG_LEVEL=INFO
            EOF
            chmod 600 .env
            
            echo "Logging into GitHub Container Registry..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u akkupratap323 --password-stdin
            
            echo "Pulling pre-built images..."
            docker pull ghcr.io/akkupratap323/nestervoiceai-backend:latest
            docker pull ghcr.io/akkupratap323/nestervoiceai-frontend:latest
            
            echo "Updating containers..."
            docker-compose -f docker-compose.ghcr.yml down || true
            docker-compose -f docker-compose.ghcr.yml up -d
            
            echo "Waiting for services..."
            sleep 15
            
            echo "Deployment complete!"
            docker ps
