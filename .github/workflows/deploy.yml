name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AWS_REGION: ap-south-1
  IMAGE_NAME: nesteraibot

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image outputs
        id: image_outputs
        run: |
          echo "backend_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: AWS_REGION,IMAGE_TAG,GHCR_TOKEN,GHCR_USER,PUBLIC_URL
          script: |
            export AWS_REGION="${{ env.AWS_REGION }}"
            export IMAGE_TAG="${{ github.sha }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export GHCR_USER="${{ github.repository_owner }}"
            export PUBLIC_URL="${{ secrets.PUBLIC_URL }}"
            
            cd ~/nester-bot
            
            # Ensure we have the latest code (including the deployment script)
            echo "=== Git Repository Setup ==="
            if [ ! -d .git ]; then
              echo "Initializing git repository..."
              git init
              git remote add origin https://github.com/nesterlabs-ai/NesterAIBot.git || git remote set-url origin https://github.com/nesterlabs-ai/NesterAIBot.git
            fi
            
            # Set correct remote
            git remote set-url origin https://github.com/nesterlabs-ai/NesterAIBot.git
            echo "Remote URL: $(git remote get-url origin)"
            
            # Fetch all branches and tags
            echo "Fetching latest code..."
            git fetch origin --prune --force || git fetch origin
            
            # Ensure we're on main branch (create if needed)
            if git show-ref --verify --quiet refs/heads/main; then
              git checkout main
            else
              git checkout -b main origin/main 2>/dev/null || git checkout -b main
            fi
            
            # Reset to latest origin/main
            echo "Resetting to origin/main..."
            git reset --hard origin/main || {
              echo "⚠️  Hard reset failed, trying soft reset..."
              git reset --soft origin/main
              git checkout -- .
            }
            
            # Verify we have the latest commit
            CURRENT_COMMIT=$(git log -1 --oneline)
            echo "Current commit: $CURRENT_COMMIT"
            echo "Expected commit should contain: lightsail-deploy"
            
            # Ensure script is executable
            if [ -f scripts/lightsail-deploy.sh ]; then
              chmod +x scripts/lightsail-deploy.sh
              echo "✅ Found scripts/lightsail-deploy.sh"
              echo "Script size: $(wc -l < scripts/lightsail-deploy.sh) lines"
              bash scripts/lightsail-deploy.sh
            else
              echo "❌ Error: scripts/lightsail-deploy.sh not found"
              echo "Current directory: $(pwd)"
              echo "Current commit: $CURRENT_COMMIT"
              echo "Branch: $(git branch --show-current)"
              echo "Remote branches:"
              git branch -r | head -5
              echo ""
              echo "Files in scripts/:"
              ls -la scripts/ || echo "scripts/ directory not found"
              echo ""
              echo "All .sh files in repo:"
              find . -name "*.sh" -type f 2>/dev/null | head -10
              echo ""
              echo "Recent commits:"
              git log --oneline -5
              exit 1
            fi

  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [build, deploy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Health Check
        run: |
          PUBLIC_URL="${{ secrets.PUBLIC_URL }}"
          MAX_RETRIES=5
          RETRY_DELAY=15
          
          echo "🔍 Performing health check on: ${PUBLIC_URL}/health"
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --insecure "${PUBLIC_URL}/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            else
              echo "⚠️  Health check failed (HTTP $HTTP_CODE)"
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Fetch Container Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "=== Backend Container Logs (last 50 lines) ==="
            docker logs --tail 50 nester-backend 2>&1 || echo "Could not fetch backend logs"
            
            echo ""
            echo "=== Container Status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            
            echo ""
            echo "=== Recent Errors (if any) ==="
            docker logs --tail 100 nester-backend 2>&1 | grep -i error | tail -10 || echo "No errors found"
