# Deploy to AWS Lightsail
# Triggers on push to main branch or manual dispatch
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID     - AWS credentials with ECR push permissions
#   AWS_SECRET_ACCESS_KEY - AWS credentials
#   AWS_ACCOUNT_ID        - Your AWS account ID (e.g., 196061557238)
#   LIGHTSAIL_SSH_KEY     - Private SSH key for Lightsail instance
#   LIGHTSAIL_HOST        - Static IP of Lightsail instance

name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'client/**'
      - 'deployment/docker/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild all images'
        required: false
        default: 'false'
        type: boolean
      skip_deploy:
        description: 'Skip deployment (build only)'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://ai.nesterlabs.com' }}

jobs:
  # Detect what changed to only build necessary images
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deployment: ${{ steps.changes.outputs.deployment }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'app/**'
              - 'deployment/docker/Dockerfile'
              - 'requirements.txt'
              - 'pyproject.toml'
            frontend:
              - 'client/**'
            deployment:
              - 'deployment/docker/docker-compose.prod.yml'
              - 'deployment/docker/Caddyfile.prod'
              - 'deployment/docker/configure-docker-cloudwatch.sh'

  # Build and push backend image
  build-backend:
    name: Build Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event.inputs.force_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nester-ai-${{ env.ENVIRONMENT }}-backend:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nester-ai-${{ env.ENVIRONMENT }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build and push frontend image
  build-frontend:
    name: Build Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event.inputs.force_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nester-ai-${{ env.ENVIRONMENT }}-frontend:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nester-ai-${{ env.ENVIRONMENT }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Config sync indicator (for visibility in Actions UI)
  sync-config:
    name: Sync Config
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Config changes detected
        run: |
          echo "::notice::Deployment config files changed - will sync to server"
          echo "Files that trigger this job:"
          echo "  - deployment/docker/docker-compose.prod.yml"
          echo "  - deployment/docker/Caddyfile.prod"

  # Deploy to Lightsail
  deploy:
    name: Deploy to Lightsail
    needs: [changes, build-backend, build-frontend, sync-config]
    if: |
      always() &&
      github.event.inputs.skip_deploy != 'true' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.sync-config.result == 'success' || needs.sync-config.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success' || needs.sync-config.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ec2-user
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deployment/docker/docker-compose.prod.yml,deployment/docker/Caddyfile.prod,deployment/docker/configure-docker-cloudwatch.sh"
          target: "/tmp/deploy"
          strip_components: 2

      - name: Deploy to Lightsail instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ec2-user
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "=== Starting deployment ==="
            cd /opt/nester

            # Update docker-compose.yml from repo
            if [ -f /tmp/deploy/docker-compose.prod.yml ]; then
              echo "Updating docker-compose.yml..."
              sudo cp /tmp/deploy/docker-compose.prod.yml /opt/nester/docker-compose.yml
            fi

            # Update Caddyfile from repo (if exists)
            if [ -f /tmp/deploy/Caddyfile.prod ]; then
              echo "Updating Caddyfile..."
              sudo cp /tmp/deploy/Caddyfile.prod /opt/nester/Caddyfile
            fi

            # Update CloudWatch config script (if exists)
            if [ -f /tmp/deploy/configure-docker-cloudwatch.sh ]; then
              echo "Updating configure-docker-cloudwatch.sh..."
              sudo cp /tmp/deploy/configure-docker-cloudwatch.sh /opt/nester/configure-docker-cloudwatch.sh
              sudo chmod +x /opt/nester/configure-docker-cloudwatch.sh
              sudo chown ec2-user:ec2-user /opt/nester/configure-docker-cloudwatch.sh
            fi

            # Clean up
            rm -rf /tmp/deploy

            # Run the deploy script (handles ECR login, pull, restart)
            ./deploy.sh

            echo "=== Deployment complete ==="

  # Verify deployment
  # Health check is mandatory - workflow fails if this fails
  verify:
    name: Health Check
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Backend health check
        run: |
          echo "Checking backend at ${{ env.PUBLIC_URL }}/health..."
          curl -f --retry 5 --retry-delay 10 --retry-all-errors ${{ env.PUBLIC_URL }}/health
          echo "Backend health check passed!"

      - name: Frontend health check
        run: |
          echo "Checking frontend at ${{ env.PUBLIC_URL }}..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 ${{ env.PUBLIC_URL }}/)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Frontend returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Frontend health check passed!"

      - name: Summary
        if: success()
        run: |
          echo "## Deployment Health Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ env.PUBLIC_URL }}/health ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ env.PUBLIC_URL }}/ ✅" >> $GITHUB_STEP_SUMMARY

  # Notify on failure
  notify:
    name: Notify on Failure
    needs: [build-backend, build-frontend, sync-config, deploy, verify]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "::error::Deployment failed! Check the workflow logs for details."
          # Add Slack/Discord notification here:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"Deployment failed!"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}