# Docker Compose for GitHub Container Registry (GHCR) deployment
# Uses pre-built images from ghcr.io instead of building locally

version: '3.8'

services:
  # Backend - Pre-built image from GHCR
  backend:
    image: ghcr.io/akkupratap323/nestervoiceai-backend:latest
    container_name: nester-backend
    restart: unless-stopped
    ports:
      - "7860:7860"
      - "8765:8765"
    environment:
      # API Keys - loaded from .env file
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX}
      # Server Configuration
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=7860
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8765
      - WEBSOCKET_SERVER=websocket_server
      - PUBLIC_URL=${PUBLIC_URL}
      # Session Settings
      - SESSION_TIMEOUT=180
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    networks:
      - nester-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend - Pre-built image from GHCR
  frontend:
    image: ghcr.io/akkupratap323/nestervoiceai-frontend:latest
    container_name: nester-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:7860
    depends_on:
      - backend
    networks:
      - nester-network

networks:
  nester-network:
    driver: bridge

